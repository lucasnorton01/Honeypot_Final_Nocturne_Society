[honeypot]
hostname = mail-server-01
sensor_name = honeypot-lab
logtype = plain
timezone = UTC

[ssh]
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
auth_class = UserDB

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
